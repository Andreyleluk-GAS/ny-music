<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07131a">
<title>Новогодний вайб 🎄 — NewYearGram</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body class="skin-classic">
<div class="bg-glow" aria-hidden="true">
  <span class="orb orb-gold"></span>
  <span class="orb orb-ruby"></span>
  <span class="orb orb-pine"></span>
</div>
<canvas id="snow" aria-hidden="true"></canvas>

<!-- ==================== СКИН 1: Классический (по умолчанию) ==================== -->
<div id="viewClassic" class="view-classic">
  <div class="garland-wrap" aria-hidden="true">
    <svg class="garland-wire" viewBox="0 0 1000 44" preserveAspectRatio="none">
      <path d="M0,4 Q125,40 250,10 T500,10 T750,10 T1000,4" fill="none" stroke="rgba(255,215,130,.28)" stroke-width="2.2"/>
      <path d="M0,2 Q125,38 250,8 T500,8 T750,8 T1000,2" fill="none" stroke="rgba(16,32,26,.95)" stroke-width="2.2"/>
    </svg>
    <ul class="lights-classic" id="lightsClassic"></ul>
  </div>

  <div class="shell">
    <header class="header">
      <div class="head-row">
        <div class="brand">
          <div class="badge-row">
            <span class="festive-badge"><span class="spark">✦</span> Праздничный плейлист</span>
            <span class="track-count" id="trackCountClassic"></span>
          </div>
          <h1>Новогодний <span class="gold-text">вайб</span> <span class="tree-icon" aria-hidden="true">🎄</span></h1>
          <p class="sub">Нажми на трек — и включи зимнее волшебство</p>
        </div>
        <button id="skinBtnClassic" class="snow-toggle" aria-label="Переключить на NewYearGram" title="Переключить скин: NewYearGram">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v20M4.93 7l14.14 10M19.07 7L4.93 17"/>
            <path d="M12 2l2.5 2.5M12 2L9.5 4.5M12 22l2.5-2.5M12 22l-2.5-2.5"/>
            <path d="M4.93 7l3.3-.6M4.93 7l.9 3.2M19.07 17l-3.3.6M19.07 17l-.9-3.2"/>
            <path d="M19.07 7l-3.3-.6M19.07 7l-.9 3.2M4.93 17l3.3.6M4.93 17l.9-3.2"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="classic-main">
      <ul id="list" class="list"></ul>
      <p id="err" class="err" hidden></p>
    </main>
  </div>

  <footer id="player" class="player" hidden>
    <div class="player-inner">
      <div class="p-top">
        <div class="p-art-wrap">
          <div class="p-cover" id="pCover">🎄</div>
        </div>
        <div class="p-info">
          <div id="pTitle" class="p-title"></div>
          <div id="pArtist" class="p-artist"></div>
        </div>
        <div class="p-live" id="pLive" aria-hidden="true">
          <span class="p-eq"><i></i><i></i><i></i><i></i></span>
          <span class="p-state" id="pState">Пауза</span>
        </div>
      </div>

      <div class="p-bar">
        <span id="tCur" class="time">0:00</span>
        <div class="seek-wrap">
          <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
        </div>
        <span id="tDur" class="time">0:00</span>
      </div>

      <div class="p-ctrl">
        <button id="shuffle" class="ctrl-btn" aria-label="Случайный трек" title="Случайный трек">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>
        <button id="prev" class="ctrl-btn" aria-label="Предыдущий" title="Предыдущий трек">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <rect x="4" y="5" width="2.6" height="14" rx="1.3"/>
            <path d="M19.5 6.4a1.2 1.2 0 0 0-1.85-1.01L8.9 11a1.2 1.2 0 0 0 0 2.02l8.75 5.6A1.2 1.2 0 0 0 19.5 17.6V6.4z"/>
          </svg>
        </button>
        <button id="play" class="ctrl-btn play-hero" aria-label="Воспроизвести или пауза" title="Play / Pause">
          <svg class="ic-play" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
            <path d="M8.2 5.2a1.4 1.4 0 0 1 2.13-1.19l9.7 5.8a1.4 1.4 0 0 1 0 2.4l-9.7 5.8A1.4 1.4 0 0 1 8.2 16.8V5.2z"/>
          </svg>
          <svg class="ic-pause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="4.5" width="4.4" height="15" rx="2"/>
            <rect x="13.6" y="4.5" width="4.4" height="15" rx="2"/>
          </svg>
        </button>
        <button id="next" class="ctrl-btn" aria-label="Следующий" title="Следующий трек">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <rect x="17.4" y="5" width="2.6" height="14" rx="1.3"/>
            <path d="M4.5 6.4a1.2 1.2 0 0 1 1.85-1.01L15.1 11a1.2 1.2 0 0 1 0 2.02l-8.75 5.6A1.2 1.2 0 0 1 4.5 17.6V6.4z"/>
          </svg>
        </button>
        <button id="repeat" class="ctrl-btn" aria-label="Повтор трека" title="Повтор текущего трека">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
          <span class="rep-one" aria-hidden="true">1</span>
        </button>
      </div>
    </div>
  </footer>
</div>

<!-- ==================== СКИН 2: NewYearGram (Reels / Stories) ==================== -->
<div id="viewGram" class="view-gram" hidden>
  <div class="app" id="app">
    <ul class="lights-gram" id="lightsGram" aria-hidden="true"></ul>

    <header class="topbar">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="24" height="24" fill="none">
            <defs>
              <linearGradient id="lgMark" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#fff0b8"/>
                <stop offset="50%" stop-color="#f7cf76"/>
                <stop offset="100%" stop-color="#e84863"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="24" height="24" rx="8" stroke="url(#lgMark)" stroke-width="2.1"/>
            <path d="M9.5 17.5V10.5M14 19.5V8.5M18.5 16.5V11.5" stroke="url(#lgMark)" stroke-width="2.3" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="logo-stack">
          <span class="logo-text">NewYear<span class="gold-text">Gram</span></span>
          <span class="logo-pill" id="trackCountGram"></span>
        </div>
      </div>

      <div class="top-actions">
        <button id="skinBtnGram" class="top-btn skin-active" aria-label="Переключить на классический вид" title="Переключить скин: Классический">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v20M4.93 7l14.14 10M19.07 7L4.93 17"/>
            <path d="M12 2l2.3 2.3M12 2L9.7 4.3M12 22l2.3-2.3M12 22l-2.3-2.3"/>
          </svg>
        </button>
        <button id="listBtn" class="top-btn" aria-label="Список всех треков" title="Все треки">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="6.5" x2="20" y2="6.5"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="17.5" x2="14" y2="17.5"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="stories" id="stories" aria-label="Треки"></nav>
    <main class="feed" id="feed" aria-label="Лента NewYearGram"></main>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <aside class="sheet" id="sheet" aria-label="Плейлист" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div>
          <h2>Новогодний плейлист</h2>
          <p class="sheet-sub">Нажми на трек для плавного перехода</p>
        </div>
        <button id="sheetClose" class="top-btn" aria-label="Закрыть список">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
          </svg>
        </button>
      </div>
      <ul class="sheet-list" id="sheetList"></ul>
    </aside>
  </div>
  <div class="desktop-hint" aria-hidden="true">↑ ↓ свайп треков · Пробел — пауза</div>
</div>

<audio id="audio" preload="none" playsinline></audio>
<script src="config.js"></script>
<script src="art.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
